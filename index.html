<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داري ثيرابيست | مركز تأهيل وتنمية الأطفال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Baloo+2:wght@500;700;800&family=Tajawal:wght@400;500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#3FA9F5; --sun:#FFC52E; --coral:#FF6B5E; --mint:#3CCB9B; --grape:#8B6CF0;
  --ink:#1D2F4E; --ink-soft:#4B5D7A; --bg:#EAF6FF; --card:#FFFFFF; --line:#CFE6F7;
  --sky-tint:#D6EEFF; --sun-tint:#FFF1BF; --coral-tint:#FFDCD8; --mint-tint:#CDF4E6; --grape-tint:#E5DEFF;
  --radius:28px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html[lang="ar"]{--head:"Baloo Bhaijaan 2","Tajawal",sans-serif;--body:"Tajawal",system-ui,sans-serif}
html[lang="en"]{--head:"Baloo 2","Nunito",system-ui,sans-serif;--body:"Nunito","Tajawal",system-ui,sans-serif}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EAF2FF; --ink-soft:#A9B9D3; --bg:#101B2E; --card:#192843; --line:#2B3F63;
    --sky-tint:#173A5C; --sun-tint:#4A3D12; --coral-tint:#4F2723; --mint-tint:#14483A; --grape-tint:#33295F;
  }
}
:root[data-theme="dark"]{
  --ink:#EAF2FF; --ink-soft:#A9B9D3; --bg:#101B2E; --card:#192843; --line:#2B3F63;
  --sky-tint:#173A5C; --sun-tint:#4A3D12; --coral-tint:#4F2723; --mint-tint:#14483A; --grape-tint:#33295F;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.7;overflow-x:hidden}
html[lang="ar"] body{line-height:1.75}
h1,h2,h3{font-family:var(--head);line-height:1.25;margin:0}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.3}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px;border-radius:10px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:24px;text-decoration:none;white-space:nowrap}
.logo-dot{width:38px;height:38px;border-radius:14px 14px 14px 4px;background:var(--sun);display:grid;place-items:center;font-size:22px;transform:rotate(-6deg)}
.nav-tools{display:flex;align-items:center;gap:10px}

.pill{border:0;cursor:pointer;font:700 17px var(--body);color:var(--ink);background:var(--card);padding:8px 18px;border-radius:99px;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill:hover{transform:translateY(-2px)}
.dd{position:relative}
.dd-btn svg{transition:transform .2s}
.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dd-menu{position:absolute;top:calc(100% + 10px);inset-inline-start:0;min-width:210px;margin:0;padding:8px;list-style:none;background:var(--card);border-radius:22px;box-shadow:0 8px 0 var(--line),0 14px 30px rgba(29,47,78,.15);display:none}
.dd-menu.open{display:block}
.dd-menu a{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;text-decoration:none;font-weight:700}
.dd-menu a:hover{background:var(--sky-tint)}
#langBtn{font-family:"Nunito","Tajawal",sans-serif;background:var(--sun);color:#1D2F4E;box-shadow:0 4px 0 #d9a210}
html[lang="en"] #langBtn{font-family:"Tajawal","Nunito",sans-serif}
@media(max-width:560px){.logo{font-size:19px}.logo-dot{width:32px;height:32px;font-size:18px}.nav-tools>.btn{display:none}.pill{padding:8px 14px;font-size:16px}}

/* buttons */
.btn{display:inline-block;border:0;cursor:pointer;font:700 18px var(--body);text-decoration:none;padding:14px 28px;border-radius:99px;transition:transform .15s}
.btn:hover{transform:translateY(-3px) rotate(-1deg)}
.btn-main{background:var(--coral);color:#fff;box-shadow:0 5px 0 #c9473c}
.btn-alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}

/* hero */
.hero{padding:34px 0 70px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(38px,6.2vw,64px);font-weight:800}
.hero h1 span{display:block}
.hero p.lead{font-size:20px;color:var(--ink-soft);margin:18px 0 28px;max-width:34em}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
.stage{position:relative;aspect-ratio:1/1;max-width:440px;width:100%;margin-inline:auto}
.blob{position:absolute;inset:6%;background:var(--sun);border-radius:58% 42% 55% 45%/48% 56% 44% 52%}
.sticker{position:absolute;display:grid;place-items:center;border-radius:30px;font-size:clamp(44px,8vw,68px);width:34%;aspect-ratio:1;box-shadow:0 8px 0 rgba(29,47,78,.14);cursor:default}
.s1{background:var(--mint);top:2%;right:6%;--r:-8deg}
.s2{background:var(--coral);top:8%;left:2%;--r:9deg}
.s3{background:var(--grape);bottom:4%;right:12%;--r:6deg}
.s4{background:var(--sky);bottom:10%;left:6%;--r:-7deg}
.sticker{transform:rotate(var(--r));animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.s2{animation-delay:.12s}.s3{animation-delay:.24s}.s4{animation-delay:.36s}
.sticker:hover{transform:rotate(calc(var(--r) * -1)) scale(1.08);transition:transform .25s}
.center-face{position:absolute;inset:34%;background:var(--card);border-radius:50%;display:grid;place-items:center;font-size:clamp(34px,6vw,54px);box-shadow:0 6px 0 rgba(29,47,78,.12)}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:rotate(var(--r));opacity:1}}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.stage{max-width:340px;order:-1}}

/* sections */
section{padding:64px 0}
.sec-head{max-width:620px;margin-bottom:30px}
.sec-head h2{font-size:clamp(30px,4.6vw,44px);font-weight:800}
.sec-head p{color:var(--ink-soft);margin-top:8px}
.band{background:var(--card);border-radius:48px 48px 0 0}

/* activities */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:0;cursor:pointer;font:700 18px var(--body);color:var(--ink);background:var(--card);padding:10px 20px;border-radius:99px;box-shadow:0 4px 0 var(--line);transition:transform .15s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--tc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transform:translateY(2px)}
.panel{background:var(--pt);border-radius:var(--radius);padding:30px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;transition:background .3s}
.panel-icon{width:clamp(96px,16vw,150px);aspect-ratio:1;border-radius:36px;background:var(--tc);display:grid;place-items:center;font-size:clamp(52px,9vw,84px);transform:rotate(-5deg);transition:background .3s}
.panel h3{font-size:30px;font-weight:800}
.panel ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.panel li{padding-inline-start:30px;position:relative}
.panel li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:16px;height:16px;border-radius:50%;background:var(--tc)}
@media(max-width:620px){.panel{grid-template-columns:1fr;padding:24px}}

/* approach */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.card{background:var(--bg);border-radius:var(--radius);padding:26px}
.card:nth-child(1){border-top-left-radius:70px}
.card:nth-child(2){border-top-right-radius:70px}
.card:nth-child(3){border-bottom-left-radius:70px}
.card:nth-child(4){border-bottom-right-radius:70px}
.card .em{font-size:38px}
.card h3{font-size:23px;font-weight:700;margin:6px 0 4px}
.card p{color:var(--ink-soft);font-size:17px}

/* day */
.day{display:grid;gap:0;max-width:640px;position:relative}
.step{display:grid;grid-template-columns:96px 1fr;gap:18px;padding-bottom:22px;position:relative}
.step::before{content:"";position:absolute;inset-inline-start:47px;top:44px;bottom:-2px;width:4px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 14px)}
.step:last-child::before{display:none}
.time{width:96px;height:44px;border-radius:99px;background:var(--tc);color:#fff;font:700 16px var(--body);display:grid;place-items:center}
.step h3{font-size:22px}
.step p{color:var(--ink-soft);font-size:17px}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
@media(max-width:820px){.contact{grid-template-columns:1fr}}
form{background:var(--card);border-radius:var(--radius);padding:28px;display:grid;gap:14px;box-shadow:0 7px 0 var(--line)}
label{font-weight:700;font-size:16px;display:grid;gap:6px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
input:focus,textarea:focus{border-color:var(--sky);outline:none}
.info{display:grid;gap:14px}
.info div{background:var(--card);border-radius:22px;padding:16px 20px;display:flex;gap:14px;align-items:center}
.info b{display:block}
.info span.em{font-size:30px}

footer{background:var(--ink);color:#EAF2FF;padding:34px 0 calc(34px + env(safe-area-inset-bottom,0px));text-align:center;font-size:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) footer{background:#0A1322}}
:root[data-theme="dark"] footer{background:#0A1322}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<header>
  <div class="wrap nav">
    <a class="logo" href="#top"><span class="logo-dot">🧸</span><span data-i="brand"></span></a>

        </button>

          <li><a href="#activities" data-i="m_act"></a></li>

          <li><a href="#contact" data-i="m_con"></a></li>

      <a class="btn btn-main" style="padding:8px 20px;font-size:16px;box-shadow:0 4px 0 #c9473c" href="#contact" data-i="book"></a>
    </div>
  </div>
</header>

<main id="top">
<div class="hero">
  <div class="wrap hero-grid">
    <div>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="hero-cta">
        <a class="btn btn-main" href="#contact" data-i="book2"></a>
        <a class="btn btn-alt" href="#activities" data-i="see"></a>
      </div>
    </div>
    <div class="stage" aria-hidden="true">
      <div class="blob"></div>
      <div class="sticker s1">⚽</div>
      <div class="sticker s2">💃</div>

    </div>
  </div>
</div>

<section id="activities" class="band">
  <div class="wrap">
    <div class="sec-head">
      <h2 data-i="a_h"></h2>
      <p data-i="a_p"></p>
    </div>
    <div class="tabs" role="tablist" data-al="tabsLabel"></div>
    <div class="panel" id="panel" role="tabpanel" aria-live="polite"></div>
  </div>
</section>

<section id="approach" class="band" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head">
      <h2 data-i="p_h"></h2>
      <p data-i="p_p"></p>
    </div>
    <div class="cards">
      <div class="card" style="background:var(--sky-tint)"><div class="em">🤝</div><h3 data-i="c1h"></h3><p data-i="c1p"></p></div>
      <div class="card" style="background:var(--sun-tint)"><div class="em">🧩</div><h3 data-i="c2h"></h3><p data-i="c2p"></p></div>
      <div class="card" style="background:var(--mint-tint)"><div class="em">👩‍🏫</div><h3 data-i="c3h"></h3><p data-i="c3p"></p></div>
      <div class="card" style="background:var(--coral-tint)"><div class="em">💬</div><h3 data-i="c4h"></h3><p data-i="c4p"></p></div>
    </div>
  </div>
</section>

<section id="day" class="band" style="padding-top:0;padding-bottom:70px">
  <div class="wrap">
    <div class="sec-head">
      <h2 data-i="d_h"></h2>
      <p data-i="d_p"></p>
    </div>
    <div class="day">
      <div class="step" style="--tc:var(--sky)"><div class="time" data-i="t1"></div><div><h3 data-i="s1h"></h3><p data-i="s1p"></p></div></div>
      <div class="step" style="--tc:var(--mint)"><div class="time" data-i="t2"></div><div><h3 data-i="s2h"></h3><p data-i="s2p"></p></div></div>
      <div class="step" style="--tc:var(--coral)"><div class="time" data-i="t3"></div><div><h3 data-i="s3h"></h3><p data-i="s3p"></p></div></div>
      <div class="step" style="--tc:var(--grape)"><div class="time" data-i="t4"></div><div><h3 data-i="s4h"></h3><p data-i="s4p"></p></div></div>
    </div>
  </div>
</section>

<section id="contact" style="background:var(--bg)">
  <div class="wrap contact">
    <div>
      <div class="sec-head" style="margin-bottom:18px">
        <h2 data-i="k_h"></h2>
        <p data-i="k_p"></p>
      </div>
      <div class="info">
        <div><span class="em">📍</span><p><b data-i="addr_l"></b><span data-i="addr_v"></span></p></div>
        <div><span class="em">📞</span><p><b data-i="phone_l"></b><span dir="ltr">+20 000 000 0000</span></p></div>
        <div><span class="em">🕘</span><p><b data-i="hours_l"></b><span data-i="hours_v"></span></p></div>
      </div>
    </div>
    <form id="f">
      <label><span data-i="f_parent"></span><input name="parent" required autocomplete="name"></label>
      <label><span data-i="f_age"></span><input name="age" required data-ph="f_age_ph"></label>
      <label><span data-i="f_msg"></span><textarea name="msg" rows="3" data-ph="f_msg_ph"></textarea></label>
      <button class="btn btn-main" type="submit" data-i="f_send"></button>
    </form>
  </div>
</section>
</main>

<footer>
  <div class="wrap" data-i="foot"></div>
</footer>

const STYLE = [
  {i:"⚽",c:"var(--mint)",t:"var(--mint-tint)"},
  {i:"💃",c:"var(--coral)",t:"var(--coral-tint)"},
  {i:"🎨",c:"var(--grape)",t:"var(--grape-tint)"},
  {i:"✏️",c:"var(--sky)",t:"var(--sky-tint)"}
];

let lang = "ar", cur = 0;
try{ const s = localStorage.getItem("dary-lang"); if(s==="ar"||s==="en") lang = s; }catch(e){}

const tabs = document.querySelector(".tabs"), panel = document.getElementById("panel");

function show(n){
  cur = n;
  const a = T[lang].acts[n], s = STYLE[n];
  panel.style.setProperty("--tc", s.c); panel.style.setProperty("--pt", s.t);
  panel.innerHTML = '<div class="panel-icon" aria-hidden="true">'+s.i+'</div><div><h3>'+a.h+'</h3><p>'+a.d+'</p><ul>'+a.l.map(x=>'<li>'+x+'</li>').join("")+'</ul></div>';
  tabs.querySelectorAll(".tab").forEach((b,j)=>b.setAttribute("aria-selected", j===n));
}
function buildTabs(){
  tabs.innerHTML = "";
  T[lang].acts.forEach((a,n)=>{
    const b = document.createElement("button");
    b.className="tab"; b.role="tab"; b.textContent=STYLE[n].i+" "+a.k; b.style.setProperty("--tc", STYLE[n].c);
    b.onclick=()=>show(n); tabs.appendChild(b);
  });
}

function setLang(l){
  lang = l;
  const d = T[l], root = document.documentElement;
  root.lang = l; root.dir = l==="ar" ? "rtl" : "ltr";
  document.title = d.title;
  document.querySelectorAll("[data-i]").forEach(el=>{ el.innerHTML = d[el.dataset.i]; });
  document.querySelectorAll("[data-ph]").forEach(el=>{ el.placeholder = d[el.dataset.ph]; });
  document.querySelectorAll("[data-al]").forEach(el=>{ el.setAttribute("aria-label", d[el.dataset.al]); });
  document.getElementById("langTxt").textContent = d.lang;
  buildTabs(); show(cur);
  try{ localStorage.setItem("dary-lang", l); }catch(e){}
}
document.getElementById("langBtn").addEventListener("click", ()=>setLang(lang==="ar" ? "en" : "ar"));
setLang(lang);

/* dropdown */
const ddBtn = document.getElementById("ddBtn"), ddMenu = document.getElementById("ddMenu");
function ddSet(open){ ddMenu.classList.toggle("open", open); ddBtn.setAttribute("aria-expanded", open); }
ddBtn.addEventListener("click", e=>{ e.stopPropagation(); ddSet(!ddMenu.classList.contains("open")); });
ddMenu.addEventListener("click", e=>{ if(e.target.closest("a")) ddSet(false); });
document.addEventListener("click", e=>{ if(!e.target.closest(".dd")) ddSet(false); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ ddSet(false); ddBtn.focus(); } });

/* form */
document.getElementById("f").addEventListener("submit", e=>{
  e.preventDefault();
  const f = new FormData(e.target);
  const text = T[lang].wa(f.get("parent"), f.get("age"), f.get("msg"));
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(text), "_blank", "noopener");
});
</script>
